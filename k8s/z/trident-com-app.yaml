# trident.yuiseki.com — the same image as .net, pointed at OpenAI.
#
# .net runs the whole stack locally: llama-server for all four roles, the
# self-hosted Nominatim and Overpass, the self-hosted map style. .com runs the
# same build and differs only in where the language models come from, so the
# two can be compared without a second image.
#
# The image name still says noopenai. It describes the build that removed the
# Ollama path, not a build that cannot reach OpenAI: USE_OPENAI_API selects
# that at runtime.
#
# Its own database. The example tables are created with the embedding model's
# dimensions and both sites name them trident_*_openai, so sharing one
# database means the second site to start finds tables of the wrong width and
# fails with "different vector dimensions 1536 and 384". trident_com exists
# for that reason alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trident-com
  namespace: trident
  labels:
    app.kubernetes.io/name: trident-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trident-com
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trident-com
    spec:
      containers:
        - name: app
          image: trident:noopenai-e1791e6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: VERCEL_ENV
              value: production
            - name: USE_POSTGRES
              value: '1'
            - name: NODE_OPTIONS
              value: --experimental-wasm-modules
            # The one difference that matters.
            - name: USE_OPENAI_API
              value: '1'
            - name: USE_LLAMA_CPP
              value: '0'
            - name: USE_OLLAMA
              value: '0'
            # The deep layer's fine-tuned prompt belongs to the fine-tuned
            # 0.5B, which is not what answers here. GPT gets the few-shot
            # prompt its examples were written for.
            - name: TRIDENT_DEEP_PROMPT_STYLE
              value: fewshot
            # Geocoding, Overpass and the map style stay self-hosted. Only the
            # language models move. These are baked into the client bundle at
            # build time and repeated here for the server half.
            - name: NEXT_PUBLIC_NOMINATIM_BASE_URL
              value: https://nominatim.yuiseki.net
            - name: NEXT_PUBLIC_OVERPASS_BASE_URL
              value: https://overpass.yuiseki.net
          envFrom:
            - secretRef:
                name: trident-env
            # Second, so its POSTGRES_DB and DATABASE_URL win over the ones
            # trident-env carries for .net.
            - secretRef:
                name: trident-com-db
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: trident-com
  namespace: trident
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trident-com
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 3000
---
# Cloudflare terminates TLS and the tunnel reaches the nginx ingress on the
# node, so there is no tls block here. Same shape as .net's ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trident-com
  namespace: trident
spec:
  ingressClassName: nginx
  rules:
    - host: trident.yuiseki.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trident-com
                port:
                  number: 80
