  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-surface
  template:
    metadata:
      labels:
        app: llama-surface
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-r-3
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "unsloth/Qwen3-1.7B-GGUF:Q4_K_M"
            - "-a"
            - "trident-surface"
            - "-c"
            - "8192"
            - "-np"
            - "1"
            - "-t"
            - "3"
            - "--reasoning"
            - "off"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "18092"
          ports:
            - containerPort: 18092
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: llama-surface-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-surface
  namespace: trident
spec:
  selector:
    app: llama-surface
  ports:
