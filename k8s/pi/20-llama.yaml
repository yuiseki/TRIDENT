# TRIDENT の 3 層 + embedding を担う llama-server 4 本。
#
# docker-compose.yml との差分と、その理由:
#   - image は :server-cuda ではなく :server (CPU)。Pi に GPU は無い。
#     どちらも arm64 マニフェストを持っているのは確認済み
#   - -ngl を外した。CPU ビルドではオフロード先が無い
#   - -fa / -ctk / -ctv (量子化 KV) を外した。-fa は実測で悪化する
#     (内層 prompt eval 16.64 -> 14.90 tok/s)。付けてはいけない
#   - nodeSelector で 3 ノードに散らした
#   - -t は層ごとに実測して決めた。下の「-t の決め方」を読むこと
#
# モデルは -hf で起動時にダウンロードし、local-path PVC にキャッシュする。
# PVC はノードに紐づくので、pod は結果的に同じノードに固定される。
# nodeSelector はそれを明示しているだけで、二重の拘束ではない。
#
# ## -t の決め方
#
# 以前ここには「ノードあたりの本数で割った (単独なら 3、2 本同居なら 2)。
# 同じノードに 2 本載せると生成が互いに遅くなる」と書いてあった。前提が誤り。
# パイプラインは表層 -> 内層 -> 深層の逐次実行で (page.tsx は各層を await で
# 繋いでいる)、同居していても同時には推論しない。各層がノードの 4 コアを
# 独占できるので、割る必要がない。
#
# 実測 2026-08-27。1449 トークンの合成プロンプト、ignore_eos で 150 トークン
# 生成を強制、pi4-r-1 / pi4-r-3 が静かな状態で 1 条件ずつ測った。
#
#   層  ノード     -t   prompt eval    生成
#   内層 pi4-r-1    2     9.48 tok/s   2.51 tok/s
#   内層 pi4-r-1    4    16.64 tok/s   3.40 tok/s
#   内層 pi5-w-1    4    89.15 tok/s   7.41 tok/s
#   内層 pi5-w-1    3    73.63 tok/s   7.47 tok/s   採用
#   深層 pi4-r-1    2    12.08 tok/s   5.23 tok/s
#   深層 pi4-r-1    4    19.17 tok/s   6.33 tok/s   1.59 / 1.21 倍  採用
#   表層 pi4-r-3    3     5.65 tok/s   2.03 tok/s   採用
#   表層 pi4-r-3    4     6.11 tok/s   1.88 tok/s   生成が 7% 悪化。却下
#
# ## 内層だけ pi5-w-1 に置く理由
#
# Pi 4 の Cortex-A72 に対し Pi 5 は A76、クロックは 1.5 から 2.4GHz。
# プロンプト処理が演算律速なので世代差がそのまま出て 5.36 倍になる。
# 内層は実プロンプトが 1585 トークンでプロンプト処理が支配項なので、
# 3 層の中でここに置く効果が最も大きい。
#
# 三層の実応答時間 (concern 1 個、静かな状態、アプリの pod へ直接)
#
#            前      -t 4    内層を pi5    温めた後
#   surface  17.9s   17.9s   17.9s        17.9s
#   inner   190.5s  123.6s    33.1s        18.8s
#   deep      8.0s    6.8s     6.9s         0.0s
#   合計    216.4s  148.3s    57.9s        36.7s
#
# 温めた状態では表層と内層がほぼ同じ割合になる。内層はもう支配項ではない。
#
# 表層は移していない。次に効くのは表層だが、pi5-w-1 は AP と k3s server と
# ビルドホストを兼ねる単一障害点で、2 層を載せると集中が進む。
#
# なお pi5-w-1 に新しいイメージを引くと、展開中に load が 24 まで上がり
# ノード自身が NotReady になる。発表当日にこれをやってはいけない。
# イメージは前日までに引いておくこと。
#
# 表層だけ結論が逆になる。 Qwen3-1.7B は帯域律速が強く、スレッドを増やすと
# 同期のオーバーヘッドが勝つ。表層は自由文を長く生成する層なので、
# プロンプト処理の 8% 改善では生成の 7% 悪化を埋められない。
# 一律に揃えず、層ごとに測ること。
#
# 深層だけは concern の行数ぶん同時に発射される (page.tsx が
# linesWithAreaAndOrConcern.map で並列に呼ぶ)。-np 1 なので llama.cpp 側で
# キューに並び、層をまたいだ同時推論にはならない。ただし応答時間に
# キュー待ちが含まれる。 遅いときはこれを推論時間と読み違えないこと。
---
# 名前に pi5 が入っているのは、内層を pi5-w-1 へ移す実験で作った PVC を
# そのまま正式採用したため。local-path なのでノードに紐づいており、
# 名前を変えると新しい空の PVC になってモデルを再ダウンロードする。
# 実体は pi5-w-1 のディスク上にあり、モデルは既に入っている。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-inner-pi5-cache
  namespace: trident
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-inner
  namespace: trident
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-inner
  template:
    metadata:
      labels:
        app: llama-inner
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi5-w-1
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "unsloth/Qwen3-0.6B-GGUF:Q4_K_M"
            - "-a"
            - "trident-inner"
            # -c は速度に効かない (8192 -> 2048 で 3.6%、ノイズと区別できない)。
            # 実プロンプトが 1585 トークンなので 2048 では余裕が薄く、
            # few-shot が伸びると exceed_context_size_error で黙って落ちる。
            # 4096 は安全な余裕を残しつつメモリを半分にする
            - "-c"
            - "4096"
            - "-np"
            - "1"
            # pi5-w-1 は 4 コアだが 3 に留める。このノードは AP と k3s server と
            # ビルドホストを兼ねる単一障害点なので、1 コアを残す。
            # 代償は 3.4 秒 (prompt eval 89.15 -> 73.63 tok/s、生成は変わらない)
            - "-t"
            - "3"
            - "--reasoning"
            - "off"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "18091"
          ports:
            - containerPort: 18091
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18091
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: llama-inner-pi5-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-inner
  namespace: trident
spec:
  selector:
    app: llama-inner
  ports:
    - port: 18091
      targetPort: 18091
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-surface-cache
  namespace: trident
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-surface
  namespace: trident
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-surface
  template:
    metadata:
      labels:
        app: llama-surface
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-r-3
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "unsloth/Qwen3-1.7B-GGUF:Q4_K_M"
            - "-a"
            - "trident-surface"
            - "-c"
            - "8192"
            - "-np"
            - "1"
            # ここだけ 4 にしない。実測で生成が 2.03 -> 1.88 tok/s に悪化する。
            # 他の層に合わせて揃えたくなるが、揃えると遅くなる
            - "-t"
            - "3"
            - "--reasoning"
            - "off"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "18092"
          ports:
            - containerPort: 18092
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: llama-surface-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-surface
  namespace: trident
spec:
  selector:
    app: llama-surface
  ports:
    - port: 18092
      targetPort: 18092
---
