# TRIDENT の 3 層 + embedding を担う llama-server 4 本。
#
# docker-compose.yml との差分と、その理由:
#   - image は :server-cuda ではなく :server (CPU)。Pi に GPU は無い。
#     どちらも arm64 マニフェストを持っているのは確認済み
#   - -ngl を外した。CPU ビルドではオフロード先が無い
#   - -fa / -ctk / -ctv (量子化 KV) を外した。-fa は実測で悪化する
#     (内層 prompt eval 16.64 -> 14.90 tok/s)。付けてはいけない
#   - nodeSelector で 3 ノードに散らした
#   - -t は層ごとに実測して決めた。下の「-t の決め方」を読むこと
#
# モデルは -hf で起動時にダウンロードし、local-path PVC にキャッシュする。
# PVC はノードに紐づくので、pod は結果的に同じノードに固定される。
# nodeSelector はそれを明示しているだけで、二重の拘束ではない。
#
# ## -t の決め方
#
# 以前ここには「ノードあたりの本数で割った (単独なら 3、2 本同居なら 2)。
# 同じノードに 2 本載せると生成が互いに遅くなる」と書いてあった。前提が誤り。
# パイプラインは表層 -> 内層 -> 深層の逐次実行で (page.tsx は各層を await で
# 繋いでいる)、同居していても同時には推論しない。各層がノードの 4 コアを
# 独占できるので、割る必要がない。
#
# 実測 2026-08-27。1449 トークンの合成プロンプト、ignore_eos で 150 トークン
# 生成を強制、pi4-r-1 / pi4-r-3 が静かな状態で 1 条件ずつ測った。
#
#   層       -t      prompt eval        生成
#   内層      2       9.48 tok/s        2.51 tok/s
#   内層      4      16.64 tok/s        3.40 tok/s   1.76 / 1.36 倍  採用
#   深層      2      12.08 tok/s        5.23 tok/s
#   深層      4      19.17 tok/s        6.33 tok/s   1.59 / 1.21 倍  採用
#   表層      3       5.65 tok/s        2.03 tok/s   採用
#   表層      4       6.11 tok/s        1.88 tok/s   生成が 7% 悪化。却下
#
# 表層だけ結論が逆になる。 Qwen3-1.7B は帯域律速が強く、スレッドを増やすと
# 同期のオーバーヘッドが勝つ。表層は自由文を長く生成する層なので、
# プロンプト処理の 8% 改善では生成の 7% 悪化を埋められない。
# 一律に揃えず、層ごとに測ること。
#
# 深層だけは concern の行数ぶん同時に発射される (page.tsx が
# linesWithAreaAndOrConcern.map で並列に呼ぶ)。-np 1 なので llama.cpp 側で
# キューに並び、層をまたいだ同時推論にはならない。ただし応答時間に
# キュー待ちが含まれる。 遅いときはこれを推論時間と読み違えないこと。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-inner-cache
  namespace: trident
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-inner
  namespace: trident
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-inner
  template:
    metadata:
      labels:
        app: llama-inner
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-r-1
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "unsloth/Qwen3-0.6B-GGUF:Q4_K_M"
            - "-a"
            - "trident-inner"
            # -c は速度に効かない (8192 -> 2048 で 3.6%、ノイズと区別できない)。
            # 実プロンプトが 1585 トークンなので 2048 では余裕が薄く、
            # few-shot が伸びると exceed_context_size_error で黙って落ちる。
            # 4096 は安全な余裕を残しつつメモリを半分にする
            - "-c"
            - "4096"
            - "-np"
            - "1"
            - "-t"
            - "4"
            - "--reasoning"
            - "off"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "18091"
          ports:
            - containerPort: 18091
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18091
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: llama-inner-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-inner
  namespace: trident
spec:
  selector:
    app: llama-inner
  ports:
    - port: 18091
      targetPort: 18091
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-surface-cache
  namespace: trident
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-surface
  namespace: trident
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-surface
  template:
    metadata:
      labels:
        app: llama-surface
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-r-3
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-hf"
            - "unsloth/Qwen3-1.7B-GGUF:Q4_K_M"
            - "-a"
            - "trident-surface"
            - "-c"
            - "8192"
            - "-np"
            - "1"
            # ここだけ 4 にしない。実測で生成が 2.03 -> 1.88 tok/s に悪化する。
            # 他の層に合わせて揃えたくなるが、揃えると遅くなる
            - "-t"
            - "3"
            - "--reasoning"
            - "off"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "18092"
          ports:
            - containerPort: 18092
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: llama-surface-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-surface
  namespace: trident
spec:
  selector:
    app: llama-surface
  ports:
    - port: 18092
      targetPort: 18092
---
